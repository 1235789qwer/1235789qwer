name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest
          accept-android-sdk-licenses: true

      - name: Unzip source
        id: locate
        run: |
          unzip -o "ZNET_一键部署.zip" -d extracted
          DIR=$(find extracted -type d -name "ZNET_Complete" | head -n 1)
          echo "project_dir=$DIR" >> $GITHUB_OUTPUT
          echo "sdk.dir=$ANDROID_HOME" > "$DIR/local.properties"

      - name: Install required Android SDK components
        run: |
          cd ${{ steps.locate.outputs.project_dir }}
          COMPILE_SDK=$(grep -rhoP '(compileSdk|compileSdkVersion)\s*=?\s*\K[0-9]+' . --include='*.gradle' --include='*.kts' 2>/dev/null | head -n 1)
          if [ -z "$COMPILE_SDK" ]; then COMPILE_SDK=35; fi
          echo "Detected compileSdk: $COMPILE_SDK"
          yes | sdkmanager --sdk_root=$ANDROID_HOME "platforms;android-$COMPILE_SDK" "build-tools;$COMPILE_SDK.0.0" > /dev/null 2>&1 || true
          yes | sdkmanager --sdk_root=$ANDROID_HOME --licenses > /dev/null 2>&1 || true

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify Gradle version
        run: gradle --version

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ steps.locate.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk

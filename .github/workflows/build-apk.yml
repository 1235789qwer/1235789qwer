name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest
          accept-android-sdk-licenses: true

      - name: Install 32-bit libs
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y libncurses5:i386 lib32z1 libstdc++6:i386 || true
          if [ ! -f /usr/lib/i386-linux-gnu/libncurses.so.5 ]; then
            sudo ln -sf /usr/lib/i386-linux-gnu/libncurses.so.6 /usr/lib/i386-linux-gnu/libncurses.so.5 || true
            sudo ln -sf /usr/lib/i386-linux-gnu/libtinfo.so.6 /usr/lib/i386-linux-gnu/libtinfo.so.5 || true
          fi

      - name: Unzip source
        id: locate
        run: |
          unzip -o "ZNET_一键部署.zip" -d extracted
          DIR=$(find extracted -type d -name "ZNET_Complete" | head -n 1)
          echo "project_dir=$DIR" >> $GITHUB_OUTPUT
          echo "sdk.dir=$ANDROID_HOME" > "$DIR/local.properties"

      - name: Setup Gradle and Re-init Wrapper
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ steps.locate.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk

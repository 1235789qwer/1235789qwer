name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest
          accept-android-sdk-licenses: true

      - name: Install dependencies & fix libncurses
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y dos2unix libncurses5:i386 lib32z1 libstdc++6:i386 || true
          # 兜底：如果系统没有libncurses5，用6伪装成5
          if [ ! -f /usr/lib/i386-linux-gnu/libncurses.so.5 ]; then
            sudo ln -sf /usr/lib/i386-linux-gnu/libncurses.so.6 /usr/lib/i386-linux-gnu/libncurses.so.5 || true
            sudo ln -sf /usr/lib/i386-linux-gnu/libtinfo.so.6 /usr/lib/i386-linux-gnu/libtinfo.so.5 || true
          fi

      - name: Unzip & auto-locate gradlew
        id: locate
        run: |
          unzip -o "ZNET_一键部署.zip" -d extracted
          GW=$(find extracted -type f -name "gradlew" | head -n 1)
          echo "gradlew path: $GW"
          if [ -z "$GW" ]; then
            echo "ERROR: gradlew not found in zip!" >&2
            exit 1
          fi
          DIR=$(dirname "$GW")
          echo "project_dir=$DIR" >> $GITHUB_OUTPUT
          echo "sdk.dir=$ANDROID_HOME" > "$DIR/local.properties"
          dos2unix "$GW"
          chmod +x "$GW"

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ steps.locate.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk

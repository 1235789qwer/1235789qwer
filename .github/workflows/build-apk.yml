name: Inspect ZIP

on: [push, workflow_dispatch]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and list
        run: |
          unzip -l ZNET_一键部署.zip
          echo "--- 解压后内容 ---"
          unzip ZNET_一键部署.zip -d extracted
          ls -la extracted
          echo "--- 递归查找 gradlew ---"
          find extracted -name "gradlew" -type f
          echo "--- 递归查找 build.gradle ---"
          find extracted -name "build.gradle" -type f
